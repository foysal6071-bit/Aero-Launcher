name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          # repo-তে থাকা প্রথম .zip খুঁজে বের করে unzip করে (না থাকলে সরাসরি সোর্স ধরে নেয়)
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Unzipping: $ZIP"
            mkdir -p _project
            unzip -q -o "$ZIP" -d _project
          else
            echo "No zip found, using repo contents"
            mkdir -p _project
            rsync -a --exclude=_project --exclude=.git ./ _project/
          fi
          # settings.gradle.kts যেই ফোল্ডারে আছে সেটাই project root
          SETTINGS=$(find _project -name "settings.gradle*" | head -n 1)
          [ -z "$SETTINGS" ] && { echo "settings.gradle not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7   # AGP 8.5.2-এর জন্য; gradlew না থাকলেও চলবে

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          APK=$(find "$PROJECT_DIR" -path "*outputs/apk/release/*.apk" | head -n 1)
          cp "$APK" dist/AeroLauncher.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroLauncher-apk
          path: dist/AeroLauncher.apk
